<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>California Climbing Areas by Climate</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.0.0/css/all.css">

    <style>
 	html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }

            .legend {
            line-height: 40px;
            font-size: 16px;
            width: 190px;
            color: #333333;
            padding: 6px 8px;
            background: white;
            background: rgba(255,255,255,0.5);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        
        .legend i {
            width: 20px;
            height: 20px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
        }
        
        .legend img {
            width: 16px;
            height: 16px;
            margin-right: 3px;
            float: left;
        }
        
        .legend p {
            font-size: 14px;
            line-height: 20px;
            margin: 0;
        }
    </style>
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">
	<script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>

</head>
<body>
<!-- Our web map and content will go here -->
<div id="map"></div>
<script>
    // 1. Create a map object
    var mymap = L.map('map', {
        center: [37.083018647694445, -120.09470785964714], //note that we've centered the map to downtown AVL
        zoom: 6, //this line adjusts the starting zoom level of the map
        maxZoom: 18,//this line sets the maximum zoom level
        minZoom: 1,//this line sets the minimum zoom level
        detectRetina: true // detect whether the screen is high resolution or not.
    });
    //2. Add a basemap
    var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
	attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    }).addTo(mymap);

    //3. Add the Geojson Data
    climbing_areas = L.geoJson.ajax("assets/area_points.geojson",{
 
    // assign a function to the onEachFeature parameter of the climbing_areas object.
    // Then each (point) feature will have a popup window.
    // The content of the popup window is the value of `Type` from the attribute table
    onEachFeature: function (feature, layer) {
      layer.bindPopup(feature.properties.Type)
    },
 
    pointToLayer: function(feature, latlng) {
      var id = 0;
      if (feature.properties.Type === "Bouldering") { id = 0; }
      else if (feature.properties.Type === "Sport")  { id = 1; }
      else if (feature.properties.Type === "Traditional")  { id = 2; }
      else if (feature.properties.Type === "Alpine")  { id = 3; }
      else { id = 4; } // All other climbing types from attribute table
      return L.marker(latlng, {
        icon: L.divIcon({
            className: 'climbing-marker',
            html: '<i class="fa-solid fa-mountain marker-color-' + (id + 1) + '"></i>'
        })
    });
    },
    attribution: 'Climb Area Point Data from Mountain Project | Ecoregions shapefile from the EPA | Base Map &copy; Stadia Terrain | Map Author: Ian Daniel'
    });

    // 4. build up a set of colors from colorbrewer's dark2 category
    var markerColors = chroma.scale('Dark2').mode('lch').colors(4);

    //5. dynamically append style classes to this page. The style classes will be used to shade the markers.
    for (i = 0; i < 4; i++) {
    $('head').append($("<style> .marker-color-" + (i + 1).toString() + " { color: " + markerColors[i] + "; font-size: 15px; text-shadow: 0 0 3px #ffffff;} </style>"));
    }
    climbing_areas.addTo(mymap);

    // 6. Set function for color ramp
    var colors = chroma.scale('Set3').colors(12); 
 
    // this function manually defines your choropleth classification system
    function setColor(NA_L3KEY) {
    var id = 0;
    //Using the include() function here since the string also contains an id code
    if (NA_L3KEY.includes("California Coastal Sage")) { id = 0; }
    else if (NA_L3KEY.includes("Northern Basin and Range")) { id = 1; }
    else if (NA_L3KEY.includes("Central Basin and Range")) { id = 2; }
    else if (NA_L3KEY.includes("Mojave Basin and Range")) { id = 3; }
    else if (NA_L3KEY.includes("Sonoran Desert")) { id = 4; }
    else if (NA_L3KEY.includes("Central California Valley")) { id = 5; }
    else if (NA_L3KEY.includes("Southern and Baja California Pine-Oak Mountains")) { id = 6; }
    else if (NA_L3KEY.includes("Klamath Mountains")) { id = 7; }
    else if (NA_L3KEY.includes("Sierra Nevada")) { id = 8; }
    else if (NA_L3KEY.includes("Coast Range")) { id = 9; }
    else if (NA_L3KEY.includes("Cascades")) { id = 10; }
    else if (NA_L3KEY.includes("Eastern Cascades Slopes and Foothills")) { id = 11; }
    else  { id = 0; }
    return colors[id];

    }
    // 7. Set style function that sets fill color property equal to Ecoregions
    function style(feature) {
        return {
            fillColor: setColor(feature.properties.NA_L3KEY),
            fillOpacity: 0.4,
            weight: 2,
            opacity: 1,
            color: '#b4b4b4',
            dashArray: '4'
        };
        }
    L.geoJson.ajax("assets/CalifEcoReg.geojson", {
    style: style,
    onEachFeature: function(feature, layer) {//allows to check feature strings in dev tools
        console.log(feature.properties.NA_L3KEY)
    }
    }).addTo(mymap);

        // 9. Create Leaflet Control Object for Legend
    var legend = L.control({position: 'topright'});
    
    // 10. Function that runs when legend is added to map
    legend.onAdd = function () {
    
        // Create Div Element and Populate it with HTML
        var div = L.DomUtil.create('div', 'legend');
        //this line creates a title for the choropleth part of the legend
        div.innerHTML += '<b>California Ecoregions</b><br />';
        //notice the class breaks entered at the end of the next 5 lines
        //the colors specify the shade of purple that we used to do the polygon shading
        div.innerHTML += '<i style="background: ' + colors[0] + '; opacity: 0.5"></i><p>California Coastal Sage, Chaparral, and Oak Woodlands</p>';
        div.innerHTML += '<i style="background: ' + colors[1] + '; opacity: 0.5"></i><p>Northern Basin and Range</p>';
        div.innerHTML += '<i style="background: ' + colors[2] + '; opacity: 0.5"></i><p>Central Basin and Range</p>';
        div.innerHTML += '<i style="background: ' + colors[3] + '; opacity: 0.5"></i><p>Mojave Basin and Range</p>';
        div.innerHTML += '<i style="background: ' + colors[4] + '; opacity: 0.5"></i><p>Sonoran Desert</p>';
        div.innerHTML += '<i style="background: ' + colors[5] + '; opacity: 0.5"></i><p>Central California Valley</p>';
        div.innerHTML += '<i style="background: ' + colors[6] + '; opacity: 0.5"></i><p>Southern and Baja California Pine-Oak Mountains</p>';
        div.innerHTML += '<i style="background: ' + colors[7] + '; opacity: 0.5"></i><p>Klamath Mountains</p>';
        div.innerHTML += '<i style="background: ' + colors[8] + '; opacity: 0.5"></i><p>Sierra Nevada</p>';
        div.innerHTML += '<i style="background: ' + colors[9]+ '; opacity: 0.5"></i><p>Coast Range</p>';
        div.innerHTML += '<i style="background: ' + colors[10] + '; opacity: 0.5"></i><p>Cascades</p>';
        div.innerHTML += '<i style="background: ' + colors[11] + '; opacity: 0.5"></i><p>Eastern Cascades Slopes and Foothills</p>';
        //this line provides the legend title for the Mountain colored symbols
        div.innerHTML += '<hr><b>Main Climbing Type<b><br />';
        //the next 3 lines call the font awesome icon along with its proper color
        //notice the names of the Climbing property types listed within the <p> tags at the end of the lines
        div.innerHTML += '<i class="fa-solid fa-mountain marker-color-1"></i><p>Bouldering</p>';
        div.innerHTML += '<i class="fa-solid fa-mountain marker-color-2"></i><p>Sport</p>';
        div.innerHTML += '<i class="fa-solid fa-mountain marker-color-3"></i><p>Traditional</p>';
        div.innerHTML += '<i class="fa-solid fa-mountain marker-color-4"></i><p>Alpine</p>';
        // Return the Legend div containing the HTML content
        return div;
    };
    
    // 11. Add a legend to map
    legend.addTo(mymap);

    // 12. Add a scale bar
    L.control.scale({position: 'bottomleft'}).addTo(mymap);

</script>
</body>
